<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');
      .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 900; }
      .bold { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
      .display { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-weight: 700; }
      .body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 600; }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E5E5DC" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="#FAFAF7"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.75"/>

  <!-- Browser Window Wrapper / Neo-brutalist Outer Frame -->
  <rect x="24" y="20" width="1152" height="590" rx="20" fill="#111111"/>
  <rect x="20" y="16" width="1152" height="590" rx="20" fill="#FAFAF7" stroke="#111111" stroke-width="3.5"/>

  <!-- Website Top Navigation Bar -->
  <rect x="20" y="16" width="1152" height="62" rx="20" fill="#FFFFFF"/>
  <rect x="20" y="58" width="1152" height="20" fill="#FFFFFF"/>
  <line x1="20" y1="78" x2="1172" y2="78" stroke="#111111" stroke-width="3"/>

  <!-- Window Dots -->
  <circle cx="50" cy="46" r="6" fill="#FF5F56" stroke="#111111" stroke-width="1.5"/>
  <circle cx="70" cy="46" r="6" fill="#FFBD2E" stroke="#111111" stroke-width="1.5"/>
  <circle cx="90" cy="46" r="6" fill="#27C93F" stroke="#111111" stroke-width="1.5"/>

  <!-- Brand / Name Logo in Navbar -->
  <rect x="120" y="32" width="28" height="28" rx="6" fill="#FFF35C" stroke="#111111" stroke-width="2"/>
  <text x="134" y="52" class="title" font-size="14" fill="#111111" text-anchor="middle">AQ</text>
  <text x="160" y="52" class="title" font-size="16" fill="#111111">ABDUL QABID SIAKA</text>
  
  <rect x="360" y="34" width="165" height="24" rx="6" fill="#FFF35C" stroke="#111111" stroke-width="1.5"/>
  <text x="442" y="50" class="mono" font-size="10" fill="#111111" text-anchor="middle">CREATIVE TECHNOLOGIST</text>

  <!-- Navbar Links -->
  <rect x="740" y="34" width="95" height="26" rx="8" fill="#FAFAF7" stroke="#111111" stroke-width="1.5"/>
  <text x="787" y="51" class="mono" font-size="10" fill="#111111" text-anchor="middle">💻 BUILD</text>

  <rect x="845" y="34" width="95" height="26" rx="8" fill="#FAFAF7" stroke="#111111" stroke-width="1.5"/>
  <text x="892" y="51" class="mono" font-size="10" fill="#111111" text-anchor="middle">🎨 DESIGN</text>

  <rect x="950" y="34" width="80" height="26" rx="8" fill="#FAFAF7" stroke="#111111" stroke-width="1.5"/>
  <text x="990" y="51" class="mono" font-size="10" fill="#111111" text-anchor="middle">👓 AR</text>

  <rect x="1040" y="34" width="112" height="26" rx="8" fill="#111111"/>
  <text x="1096" y="51" class="mono" font-size="10" fill="#FFF35C" text-anchor="middle">GET IN TOUCH</text>

  <!-- MAIN HOMEPAGE HERO SECTION -->
  
  <!-- Status Badge -->
  <g transform="translate(56, 106)">
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#B9F5D0" stroke="#111111" stroke-width="2"/>
    <circle cx="16" cy="15" r="4" fill="#10B981"/>
    <text x="146" y="20" class="mono" font-size="11" fill="#111111" text-anchor="middle">AVAILABLE FOR WORK · GHANA / REMOTE</text>
  </g>

  <!-- Giant Neo-Brutalist Headlines -->
  <text x="56" y="180" class="title" font-size="44" fill="#111111" letter-spacing="-1.5">I BUILD DIGITAL PRODUCTS.</text>
  <text x="56" y="230" class="title" font-size="44" fill="#111111" letter-spacing="-1.5">DESIGN VISUAL EXPERIENCES.</text>
  <text x="56" y="280" class="title" font-size="44" fill="#111111" letter-spacing="-1.5">CREATE INTERACTIVE AR.</text>

  <!-- Subtitle Paragraph -->
  <text x="56" y="322" class="body" font-size="16" fill="#444444">Crafting clinical AI systems, high-converting visual media, and viral augmented reality lenses from Ghana to the world.</text>

  <!-- Hero Buttons -->
  <g transform="translate(56, 350)">
    <!-- Primary CTA Yellow Button with Hard Shadow -->
    <rect x="4" y="4" width="220" height="46" rx="12" fill="#111111"/>
    <rect x="0" y="0" width="220" height="46" rx="12" fill="#FFF35C" stroke="#111111" stroke-width="2.5"/>
    <text x="110" y="28" class="title" font-size="13" fill="#111111" text-anchor="middle">EXPLORE WORLDS ↘</text>

    <!-- Secondary Quick Inquiry Button -->
    <rect x="236" y="0" width="140" height="46" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="306" y="28" class="bold" font-size="12" fill="#111111" text-anchor="middle">✉ QUICK INQUIRY</text>

    <!-- Resume Button -->
    <rect x="388" y="0" width="150" height="46" rx="12" fill="#C9B8FF" stroke="#111111" stroke-width="2"/>
    <text x="463" y="28" class="bold" font-size="12" fill="#111111" text-anchor="middle">📄 RECRUITER RESUME</text>
  </g>

  <!-- Right Floating Interactive Hub Card -->
  <g transform="translate(820, 106)">
    <!-- Shadow -->
    <rect x="6" y="6" width="310" height="280" rx="18" fill="#111111"/>
    <!-- Card Body -->
    <rect x="0" y="0" width="310" height="280" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="310" height="40" rx="18" fill="#111111"/>
    <rect x="0" y="20" width="310" height="20" fill="#111111"/>
    <text x="20" y="26" class="mono" font-size="11" fill="#FFF35C">CREATIVE TECH MATRIX</text>
    <text x="290" y="26" class="mono" font-size="11" fill="#FFFFFF" text-anchor="end">v2026</text>

    <!-- Stat 1: AI / Software -->
    <rect x="16" y="55" width="278" height="60" rx="10" fill="#FAFAF7" stroke="#E5E5DC" stroke-width="1.5"/>
    <rect x="26" y="65" width="40" height="40" rx="8" fill="#FFF35C" stroke="#111111" stroke-width="1.5"/>
    <text x="46" y="90" class="title" font-size="18" fill="#111111" text-anchor="middle">💻</text>
    <text x="76" y="78" class="bold" font-size="13" fill="#111111">MedVision &amp; Full-Stack</text>
    <text x="76" y="96" class="mono" font-size="10" fill="#666666">React · Python · FastAPI · CV</text>

    <!-- Stat 2: Graphic & Branding -->
    <rect x="16" y="125" width="278" height="60" rx="10" fill="#FAFAF7" stroke="#E5E5DC" stroke-width="1.5"/>
    <rect x="26" y="135" width="40" height="40" rx="8" fill="#FFB7D5" stroke="#111111" stroke-width="1.5"/>
    <text x="46" y="160" class="title" font-size="18" fill="#111111" text-anchor="middle">🎨</text>
    <text x="76" y="148" class="bold" font-size="13" fill="#111111">Viral Visuals &amp; Media</text>
    <text x="76" y="166" class="mono" font-size="10" fill="#666666">Thumbnails · Branding · Canva Pro</text>

    <!-- Stat 3: Augmented Reality -->
    <rect x="16" y="195" width="278" height="60" rx="10" fill="#FAFAF7" stroke="#E5E5DC" stroke-width="1.5"/>
    <rect x="26" y="205" width="40" height="40" rx="8" fill="#C9B8FF" stroke="#111111" stroke-width="1.5"/>
    <text x="46" y="230" class="title" font-size="18" fill="#111111" text-anchor="middle">👓</text>
    <text x="76" y="218" class="bold" font-size="13" fill="#111111">100K+ AR Lens Impressions</text>
    <text x="76" y="236" class="mono" font-size="10" fill="#666666">Snapchat Official Creator · Lens Studio</text>
  </g>

  <!-- BOTTOM THREE WORLD PREVIEW CARDS (The 3 Signature Sections) -->
  <g transform="translate(56, 422)">
    <!-- WORLD 1: BUILD -->
    <g transform="translate(0, 0)">
      <rect x="4" y="4" width="340" height="150" rx="16" fill="#111111"/>
      <rect x="0" y="0" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
      <rect x="14" y="14" width="105" height="24" rx="6" fill="#FFF35C" stroke="#111111" stroke-width="1.5"/>
      <text x="66" y="30" class="mono" font-size="10" fill="#111111" text-anchor="middle">💻 BUILD WORLD</text>
      <text x="325" y="30" class="mono" font-size="11" fill="#10B981" text-anchor="end">● LIVE APPS</text>
      <text x="14" y="65" class="title" font-size="17" fill="#111111">MedVision &amp; Yugogoo</text>
      <text x="14" y="86" class="body" font-size="12" fill="#555555">AI Pediatric radiograph diagnosis tool &amp; realtime event ticketing platforms.</text>
      <line x1="14" y1="106" x2="326" y2="106" stroke="#ECECE4" stroke-width="1.5"/>
      <text x="14" y="128" class="mono" font-size="10" fill="#777777">STACK: REACT · PYTHON · FASTAPI</text>
    </g>

    <!-- WORLD 2: DESIGN -->
    <g transform="translate(366, 0)">
      <rect x="4" y="4" width="340" height="150" rx="16" fill="#111111"/>
      <rect x="0" y="0" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
      <rect x="14" y="14" width="115" height="24" rx="6" fill="#FFB7D5" stroke="#111111" stroke-width="1.5"/>
      <text x="71" y="30" class="mono" font-size="10" fill="#111111" text-anchor="middle">🎨 DESIGN WORLD</text>
      <text x="325" y="30" class="mono" font-size="11" fill="#FF5F56" text-anchor="end">● HIGH CTR</text>
      <text x="14" y="65" class="title" font-size="17" fill="#111111">Thumbnails &amp; Brand Systems</text>
      <text x="14" y="86" class="body" font-size="12" fill="#555555">High-converting creator graphics, festival identities, and marketing decks.</text>
      <line x1="14" y1="106" x2="326" y2="106" stroke="#ECECE4" stroke-width="1.5"/>
      <text x="14" y="128" class="mono" font-size="10" fill="#777777">TOOLS: CANVA ADVANCED · PHOTOSHOP</text>
    </g>

    <!-- WORLD 3: AR -->
    <g transform="translate(732, 0)">
      <rect x="4" y="4" width="340" height="150" rx="16" fill="#111111"/>
      <rect x="0" y="0" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
      <rect x="14" y="14" width="95" height="24" rx="6" fill="#C9B8FF" stroke="#111111" stroke-width="1.5"/>
      <text x="61" y="30" class="mono" font-size="10" fill="#111111" text-anchor="middle">👓 AR WORLD</text>
      <text x="325" y="30" class="mono" font-size="11" fill="#8B5CF6" text-anchor="end">● 100K+ VIEWS</text>
      <text x="14" y="65" class="title" font-size="17" fill="#111111">Snapchat AR Experiences</text>
      <text x="14" y="86" class="body" font-size="12" fill="#555555">Interactive facial tracking, cyberpunk shaders, and real-time VFX lenses.</text>
      <line x1="14" y1="106" x2="326" y2="106" stroke="#ECECE4" stroke-width="1.5"/>
      <text x="14" y="128" class="mono" font-size="10" fill="#777777">TOOLS: LENS STUDIO · 3D SHADERS</text>
    </g>
  </g>
</svg>