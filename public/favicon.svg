  <!-- Subtle inner perimeter sheen for premium tactile feel -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  
  <!-- Modern Clean AQ Monogram -->
